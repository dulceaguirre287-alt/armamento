<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Gestión de armamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body class="login-page">
<main class="login-card">
    <div class="login-card__brand"><img th:src="@{/img/armamento-mark.svg}" alt="Gestión de armamento"></div>
    <p class="eyebrow" style="text-align:center">Acceso seguro</p>
    <h1>Bienvenido</h1>
    <p class="login-card__subtitle">Ingresa tus credenciales para continuar.</p>
    <div class="alert alert--error" th:if="${param.error}" role="alert">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span>Usuario o contraseña inválidos, o cuenta temporalmente bloqueada.</span>
    </div>
    <div class="alert alert--success" th:if="${param.logout}" role="status">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i><span>Sesión cerrada correctamente.</span>
    </div>
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary" type="submit">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Ingresar
        </button>
    </form>
</main>
</body>
</html>
