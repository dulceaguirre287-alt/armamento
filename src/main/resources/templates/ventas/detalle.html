<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:replace="~{fragments/layout :: shell('Detalle de venta', 'ventas', ~{::content})}">
    <section th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <header class="page-heading"><div><p class="eyebrow">Comercial</p><h1 th:text="${venta.numeroVenta}">Venta</h1>
            <p class="page-heading__subtitle" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}">Fecha</p></div>
            <a class="btn btn--secondary" th:href="@{/ventas}">Volver a ventas</a></header>
        <section class="panel detail-grid">
            <div class="detail-item"><span class="detail-item__label">Cliente</span><span class="detail-item__value" th:text="${venta.clienteNombre}">Cliente</span></div>
            <div class="detail-item"><span class="detail-item__label">Almacén</span><span class="detail-item__value" th:text="${venta.almacenNombre}">Almacén</span></div>
            <div class="detail-item"><span class="detail-item__label">Usuario</span><span class="detail-item__value" th:text="${venta.usuarioNombre}">Usuario</span></div>
            <div class="detail-item"><span class="detail-item__label">Método de pago</span><span class="detail-item__value" th:text="${venta.metodoPago}">Pago</span></div>
            <div class="detail-item"><span class="detail-item__label">Estado</span><span class="badge" th:classappend="${venta.estado == 'ANULADA'} ? ' badge--danger' : ' badge--success'" th:text="${venta.estado}">Estado</span></div>
            <div class="detail-item"><span class="detail-item__label">Observaciones</span><span class="detail-item__value" th:text="${venta.observaciones ?: '—'}">—</span></div>
        </section>
        <section class="panel panel--flush section-spaced">
            <h2 class="panel-title">Detalle de productos</h2>
            <div class="table-wrap"><table class="data-table"><thead><tr><th>SKU</th><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>IVA</th><th>Lote</th><th>Subtotal</th></tr></thead>
                <tbody><tr th:each="detalle : ${venta.detalles}">
                    <td th:text="${detalle.productoSku}">SKU</td><td th:text="${detalle.productoNombre}">Producto</td>
                    <td th:text="${detalle.cantidad}">1</td><td th:text="'$ ' + ${#numbers.formatDecimal(detalle.precioUnitario, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                    <td th:text="${detalle.porcentajeIva} + '%'">0%</td><td th:text="${detalle.lote ?: '—'}">—</td>
                    <td th:text="'$ ' + ${#numbers.formatDecimal(detalle.subtotal, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                </tr></tbody></table></div>
            <div class="totals"><div class="totals__row"><span>Subtotal</span><strong th:text="'$ ' + ${#numbers.formatDecimal(venta.subtotal, 1, 'POINT', 2, 'COMMA')}">$ 0</strong></div>
                <div class="totals__row"><span>Descuento</span><strong th:text="'$ ' + ${#numbers.formatDecimal(venta.descuento, 1, 'POINT', 2, 'COMMA')}">$ 0</strong></div>
                <div class="totals__row"><span>IVA</span><strong th:text="'$ ' + ${#numbers.formatDecimal(venta.iva, 1, 'POINT', 2, 'COMMA')}">$ 0</strong></div>
                <div class="totals__row totals__row--grand"><span>Total</span><strong th:text="'$ ' + ${#numbers.formatDecimal(venta.total, 1, 'POINT', 2, 'COMMA')}">$ 0</strong></div></div>
        </section>
        <form class="form-actions section-spaced" th:if="${venta.estado != 'ANULADA'}" sec:authorize="hasRole('ADMINISTRADOR')"
              th:action="@{/ventas/{id}/anular(id=${venta.id})}" method="post" data-confirm="¿Anular esta venta y restaurar el inventario?">
            <button class="btn btn--danger" type="submit">Anular venta</button>
        </form>
    </section>
</th:block>
</body>
</html>
