<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{fragments/layout :: shell(${title}, ${resource}, ~{::content})}">
    <section th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <header class="page-heading"><div><p class="eyebrow">Administración</p><h1 th:text="${title}">Módulo</h1>
            <p class="page-heading__subtitle" th:text="${page.totalElements} + ' registros'">Registros</p></div>
            <a class="btn btn--primary" th:href="@{/mvc/{resource}/nuevo(resource=${resource})}">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> Nuevo registro</a></header>
        <section class="panel panel--flush">
            <div class="toolbar"><form class="search-form" method="get" th:action="@{/mvc/{resource}(resource=${resource})}" role="search">
                <label class="sr-only" for="resource-search">Buscar en el listado</label>
                <input id="resource-search" type="search" name="q" th:value="${q}" placeholder="Buscar registros">
                <input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}">
                <button class="btn btn--secondary" type="submit"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Buscar</button>
            </form></div>
            <div class="table-wrap" th:if="${!rows.isEmpty()}"><table class="data-table">
                <thead><tr><th scope="col" th:each="field : ${fields}">
                    <a class="table-sort" th:href="@{/mvc/{resource}(resource=${resource},q=${q},sort=${field.name},direction=${sort == field.name and direction == 'asc' ? 'desc' : 'asc'})}"
                       th:text="${field.label}">Campo</a></th><th scope="col">Acciones</th></tr></thead>
                <tbody><tr th:each="row : ${rows}">
                    <td th:each="field : ${fields}">
                        <span th:if="${field.name.toLowerCase().contains('activo') or field.name.toLowerCase().contains('estado')}"
                              class="badge" th:text="${row[field.name]}">Estado</span>
                        <span th:unless="${field.name.toLowerCase().contains('activo') or field.name.toLowerCase().contains('estado')}"
                              th:text="${row[field.name]}">Valor</span>
                    </td>
                    <td class="table-actions">
                        <a class="btn btn--small btn--secondary" th:href="@{/mvc/{resource}/{id}(resource=${resource},id=${row['id']})}">Ver</a>
                        <a class="btn btn--small btn--secondary" th:href="@{/mvc/{resource}/{id}/editar(resource=${resource},id=${row['id']})}">Editar</a>
                        <form th:action="@{/mvc/{resource}/{id}/eliminar(resource=${resource},id=${row['id']})}" method="post" data-confirm="¿Eliminar este registro? Esta acción no se puede deshacer.">
                            <button class="btn btn--small btn--danger" type="submit">Eliminar</button></form>
                    </td>
                </tr></tbody></table></div>
            <div class="empty-state" th:if="${rows.isEmpty()}"><i class="fa-solid fa-folder-open" aria-hidden="true"></i>
                <h2>Sin registros</h2><p>No se encontraron datos para este módulo.</p></div>
            <div th:replace="~{fragments/pagination :: pagination(${page}, '/mvc/' + ${resource}, ${q})}"></div>
        </section>
    </section>
</th:block>
</body>
</html>
