<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:replace="~{fragments/layout :: shell('Productos', 'productos', ~{::content})}">
    <section th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <header class="page-heading">
            <div><p class="eyebrow">Catálogo</p><h1>Productos</h1>
                <p class="page-heading__subtitle" th:text="${productos.totalElements} + ' productos registrados'">Catálogo</p></div>
            <a class="btn btn--primary" sec:authorize="hasAnyRole('ADMINISTRADOR','ALMACENISTA')" th:href="@{/productos/nuevo}">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> Nuevo producto
            </a>
        </header>
        <section class="panel panel--flush">
            <div class="toolbar">
                <form class="search-form" method="get" th:action="@{/productos}" role="search">
                    <label class="sr-only" for="producto-search">Buscar producto</label>
                    <input id="producto-search" name="q" type="search" th:value="${q}" placeholder="Buscar por SKU o nombre">
                    <button class="btn btn--secondary" type="submit"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Buscar</button>
                </form>
            </div>
            <div class="table-wrap" th:if="${productos.hasContent()}">
                <table class="data-table">
                    <thead><tr><th>SKU</th><th>Producto</th><th>Categoría</th><th>Precio venta</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="producto : ${productos.content}">
                        <td th:text="${producto.sku}">SKU</td>
                        <td><a th:href="@{/productos/{id}(id=${producto.id})}" th:text="${producto.nombre}">Producto</a></td>
                        <td th:text="${producto.categoriaNombre}">Categoría</td>
                        <td th:text="'$ ' + ${#numbers.formatDecimal(producto.precioVenta, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                        <td><span class="badge" th:classappend="${producto.activo} ? ' badge--success' : ' badge--danger'"
                                  th:text="${producto.activo} ? 'Activo' : 'Inactivo'">Activo</span></td>
                        <td class="table-actions">
                            <a class="btn btn--small btn--secondary" sec:authorize="hasAnyRole('ADMINISTRADOR','ALMACENISTA')" th:href="@{/productos/{id}/editar(id=${producto.id})}" aria-label="Editar producto">
                                <i class="fa-solid fa-pen" aria-hidden="true"></i><span class="sr-only">Editar</span>
                            </a>
                            <form th:if="${producto.activo}" sec:authorize="hasAnyRole('ADMINISTRADOR','ALMACENISTA')" th:action="@{/productos/{id}/desactivar(id=${producto.id})}"
                                  method="post" data-confirm="¿Desactivar este producto?">
                                <button class="btn btn--small btn--danger" type="submit">Desactivar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty-state" th:unless="${productos.hasContent()}">
                <i class="fa-solid fa-box-open" aria-hidden="true"></i><h2>No hay productos</h2>
                <p>Prueba otra búsqueda o registra el primer producto.</p>
            </div>
            <div th:replace="~{fragments/pagination :: pagination(${productos}, '/productos', ${q})}"></div>
        </section>
    </section>
</th:block>
</body>
</html>
