<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{fragments/layout :: shell('Solicitud no válida', 'inicio', ~{::content})}">
    <section class="empty-state" th:fragment="content">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><p class="eyebrow">Error 400</p>
        <h1>Solicitud no válida</h1><p th:text="${mensaje ?: 'Revisa la información e inténtalo de nuevo.'}">Solicitud incorrecta.</p>
        <a class="btn btn--primary" th:href="@{/}">Volver al inicio</a>
    </section>
</th:block>
</body>
</html>
