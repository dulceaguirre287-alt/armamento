<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{fragments/layout :: shell(${editing ? 'Editar ' + title : 'Nuevo ' + title}, ${resource}, ~{::content})}">
    <section th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <header class="page-heading"><div><p class="eyebrow">Administración</p>
            <h1 th:text="${editing ? 'Editar ' + title : 'Nuevo registro de ' + title}">Formulario</h1></div></header>
        <form class="panel" th:action="${action}" method="post">
            <div class="field-grid">
                <div class="field" th:each="field : ${fields}" th:if="${!(field.generated and !editing)}">
                    <label th:for="${field.name}" th:text="${field.label}">Campo</label>
                    <select th:if="${field.inputType == 'boolean'}" th:id="${field.name}" th:name="${field.name}">
                        <option value="" th:selected="${values[field.name] == null or values[field.name] == ''}">Sin especificar</option>
                        <option value="true" th:selected="${values[field.name] == 'true'}">Sí</option>
                        <option value="false" th:selected="${values[field.name] == 'false'}">No</option>
                    </select>
                    <textarea th:if="${field.inputType == 'textarea'}" th:id="${field.name}" th:name="${field.name}"
                              th:readonly="${field.primaryKey and editing}" th:required="${field.required and !field.secret}"
                              th:text="${values[field.name]}"></textarea>
                    <input th:if="${field.inputType != 'boolean' and field.inputType != 'textarea'}"
                           th:id="${field.name}" th:name="${field.name}"
                           th:type="${field.secret ? 'password' : (field.inputType == 'number-decimal' ? 'number' : field.inputType)}"
                           th:step="${field.inputType == 'number-decimal' ? 'any' : null}"
                           th:value="${field.secret ? '' : values[field.name]}"
                           th:readonly="${field.primaryKey and editing}"
                           th:required="${field.required and !field.secret}"
                           th:placeholder="${field.secret and editing ? 'Dejar vacío para conservar el valor actual' : ''}">
                </div>
            </div>
            <p class="form-hint" th:if="${resource == 'usuarios'}">Las credenciales se procesan y protegen en el servidor; nunca ingreses hashes manualmente.</p>
            <div class="form-actions"><a class="btn btn--secondary" th:href="@{/mvc/{resource}(resource=${resource})}">Cancelar</a>
                <button class="btn btn--primary" type="submit" th:text="${editing ? 'Guardar cambios' : 'Crear registro'}">Guardar</button></div>
        </form>
    </section>
</th:block>
</body>
</html>
