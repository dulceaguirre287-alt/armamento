<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:replace="~{fragments/layout :: shell('Detalle de compra', 'compras', ~{::content})}">
    <section th:fragment="content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <header class="page-heading"><div><p class="eyebrow">Abastecimiento</p><h1 th:text="${compra.numeroCompra}">Compra</h1>
            <p class="page-heading__subtitle" th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy')}">Fecha</p></div>
            <a class="btn btn--secondary" th:href="@{/compras}">Volver a compras</a></header>
        <section class="panel detail-grid">
            <div class="detail-item"><span class="detail-item__label">Proveedor</span><span class="detail-item__value" th:text="${compra.proveedorNombre}">Proveedor</span></div>
            <div class="detail-item"><span class="detail-item__label">Almacén</span><span class="detail-item__value" th:text="${compra.almacenNombre}">Almacén</span></div>
            <div class="detail-item"><span class="detail-item__label">Usuario</span><span class="detail-item__value" th:text="${compra.usuarioNombre}">Usuario</span></div>
            <div class="detail-item"><span class="detail-item__label">Estado</span><span class="badge" th:classappend="${compra.estado == 'ANULADA'} ? ' badge--danger' : ' badge--success'" th:text="${compra.estado}">Estado</span></div>
        </section>
        <section class="panel panel--flush section-spaced"><h2 class="panel-title">Productos recibidos</h2>
            <div class="table-wrap"><table class="data-table"><thead><tr><th>SKU</th><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>IVA</th><th>Lote</th><th>Subtotal</th></tr></thead>
                <tbody><tr th:each="detalle : ${compra.detalles}"><td th:text="${detalle.productoSku}">SKU</td><td th:text="${detalle.productoNombre}">Producto</td>
                    <td th:text="${detalle.cantidadRecibida}">1</td><td th:text="'$ ' + ${#numbers.formatDecimal(detalle.precioUnitario, 1, 'POINT', 2, 'COMMA')}">$ 0</td>
                    <td th:text="${detalle.porcentajeIva} + '%'">0%</td><td th:text="${detalle.lote ?: '—'}">—</td>
                    <td th:text="'$ ' + ${#numbers.formatDecimal(detalle.subtotal, 1, 'POINT', 2, 'COMMA')}">$ 0</td></tr></tbody></table></div>
            <div class="totals"><div class="totals__row"><span>Subtotal</span><strong th:text="'$ ' + ${#numbers.formatDecimal(compra.subtotal, 1, 'POINT', 2, 'COMMA')}">$ 0</strong></div>
                <div class="totals__row"><span>IVA</span><strong th:text="'$ ' + ${#numbers.formatDecimal(compra.iva, 1, 'POINT', 2, 'COMMA')}">$ 0</strong></div>
                <div class="totals__row totals__row--grand"><span>Total</span><strong th:text="'$ ' + ${#numbers.formatDecimal(compra.total, 1, 'POINT', 2, 'COMMA')}">$ 0</strong></div></div>
        </section>
        <form class="form-actions section-spaced" th:if="${compra.estado != 'ANULADA'}" sec:authorize="hasRole('ADMINISTRADOR')"
              th:action="@{/compras/{id}/anular(id=${compra.id})}" method="post" data-confirm="¿Anular esta compra y ajustar el inventario?">
            <button class="btn btn--danger" type="submit">Anular compra</button>
        </form>
    </section>
</th:block>
</body>
</html>
